name: Build, Package, and Release for Windows

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      version_bump:
        description: '版本号更新类型 (major/minor/patch)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

env:
  DOTNET_VERSION: '10.0.x'
  RUNTIME_ID: 'win-x64'
  CONFIGURATION: 'Release'
  PROJECT_NAME: 'Updater'
  OUTPUT_DIR: './publish'
  ASSETS_DIR: './release-assets'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine version increment
      id: version
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          BUMP_TYPE="${{ github.event.inputs.version_bump }}"
        else
          if [[ "${{ github.event.head_commit.message }}" =~ \[major\] ]]; then
            BUMP_TYPE="major"
          elif [[ "${{ github.event.head_commit.message }}" =~ \[minor\] ]]; then
            BUMP_TYPE="minor"
          else
            BUMP_TYPE="patch"
          fi
        fi

        if [ -f version.ini ]; then
          CURRENT_VERSION=$(grep -oP '^\d+\.\d+\.\d+' version.ini)
        else
          CURRENT_VERSION="1.0.0"
        fi

        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

        case "$BUMP_TYPE" in
          major)
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
          minor)
            MINOR=$((MINOR + 1)); PATCH=0 ;;
          patch)
            PATCH=$((PATCH + 1)) ;;
        esac

        NEW_VERSION="$MAJOR.$MINOR.$PATCH"
        BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        BUILD_TIMESTAMP=$(date +%s)

        {
          echo "current_version=$CURRENT_VERSION"
          echo "new_version=$NEW_VERSION"
          echo "build_date=$BUILD_DATE"
          echo "build_timestamp=$BUILD_TIMESTAMP"
          echo "bump_type=$BUMP_TYPE"
          echo "release_tag=v$NEW_VERSION"
          echo "version_major=$MAJOR"
          echo "version_minor=$MINOR"
          echo "version_patch=$PATCH"
        } >> "$GITHUB_OUTPUT"

    - name: Update version files
      if: "!contains(github.event.head_commit.message, '[skip-version]')"
      shell: bash
      run: |
        echo "${{ steps.version.outputs.new_version }} (${{ steps.version.outputs.build_date }})" > version.ini

        if [ -f "$PROJECT_NAME/$PROJECT_NAME.csproj" ]; then
          sed -i "s/<Version>[^<]*<\/Version>/<Version>${{ steps.version.outputs.new_version }}<\/Version>/" \
            "$PROJECT_NAME/$PROJECT_NAME.csproj"
        fi

    - name: Commit version changes
      if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip-version]')
      shell: bash
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add version.ini "$PROJECT_NAME/$PROJECT_NAME.csproj" 2>/dev/null || true
        git diff --cached --quiet || {
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }} [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git \
            HEAD:${{ github.ref_name }}
        }

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore $PROJECT_NAME/$PROJECT_NAME.csproj

    - name: Build project
      run: |
        dotnet build $PROJECT_NAME/$PROJECT_NAME.csproj \
          -c ${{ env.CONFIGURATION }} \
          --no-restore

    - name: Run tests
      run: |
        dotnet test $PROJECT_NAME/$PROJECT_NAME.csproj \
          --no-build || echo "Tests failed, continuing"

    - name: Publish application
      run: |
        dotnet publish $PROJECT_NAME/$PROJECT_NAME.csproj \
          -c ${{ env.CONFIGURATION }} \
          -r ${{ env.RUNTIME_ID }} \
          --no-build \
          --self-contained false \
          -o ${{ env.OUTPUT_DIR }} \
          /p:PublishSingleFile=true \
          /p:EnableCompressionInSingleFile=true

    - name: Collect file information
      id: file_info
      shell: bash
      run: |
        EXE="${{ env.OUTPUT_DIR }}/${{ env.PROJECT_NAME }}.exe"
        test -f "$EXE"

        SIZE=$(stat -c%s "$EXE")
        SIZE_MB=$(echo "scale=2; $SIZE/1024/1024" | bc)
        SHA256=$(sha256sum "$EXE" | cut -d' ' -f1)
        MD5=$(md5sum "$EXE" | cut -d' ' -f1)

        {
          echo "file_size=$SIZE"
          echo "file_size_mb=$SIZE_MB"
          echo "sha256=$SHA256"
          echo "md5=$MD5"
        } >> "$GITHUB_OUTPUT"

        echo "$SHA256  Updater.exe" > "$EXE.sha256"
        echo "$MD5  Updater.exe" > "$EXE.md5"

    - name: Prepare release assets
      shell: bash
      run: |
        mkdir -p "${{ env.ASSETS_DIR }}"
        cp ${{ env.OUTPUT_DIR }}/* "${{ env.ASSETS_DIR }}/"
        7z a -tzip -mx9 "${{ env.ASSETS_DIR }}/update.zip" \
          "${{ env.OUTPUT_DIR }}/${{ env.PROJECT_NAME }}.exe"

    - name: Generate update_info.json
      shell: bash
      run: |
        cat > "${{ env.ASSETS_DIR }}/update_info.json" <<'EOF'
{
  "application": {
    "name": "Updater",
    "version": "${{ steps.version.outputs.new_version }}",
    "buildNumber": "${{ steps.version.outputs.build_timestamp }}"
  },
  "release": {
    "tag": "${{ steps.version.outputs.release_tag }}",
    "date": "${{ steps.version.outputs.build_date }}",
    "type": "${{ steps.version.outputs.bump_type }}"
  },
  "files": [
    {
      "name": "Updater.exe",
      "size": ${{ steps.file_info.outputs.file_size }},
      "sha256": "${{ steps.file_info.outputs.sha256 }}"
    }
  ]
}
EOF

    - name: Validate JSON
      run: python3 -c "import json;json.load(open('${{ env.ASSETS_DIR }}/update_info.json'))"

    - name: Create GitHub Release
      if: github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.release_tag }}
        name: Release ${{ steps.version.outputs.release_tag }}
        files: ${{ env.ASSETS_DIR }}/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: |
          ${{ env.OUTPUT_DIR }}
          ${{ env.ASSETS_DIR }}

    - name: Cleanup
      run: echo "构建完成：${{ steps.version.outputs.new_version }}"
