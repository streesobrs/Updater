name: Build & Release (单文件版)

on:
  push:
    branches:
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish (单文件 + 独立部署)
        run: |
          dotnet publish \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            --output ./output \
            --single-file \
            --no-restore
          # 发布后会生成独立的 Updater.exe

      - name: Verify single file
        run: |
          if [ -f ./output/Updater.exe ]; then
            echo "单文件发布成功: Updater.exe"
          else
            echo "单文件发布失败"
            exit 1
          fi

      - name: Create update.zip (仅包含 Updater.exe)
        run: |
          sudo apt-get install -y p7zip-full
          7z a -tzip update.zip ./output/Updater.exe

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.increment_version.outputs.new_version }}
          release_name: Release v${{ steps.increment_version.outputs.new_version }}
          prerelease: false

      - name: Upload update.zip
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./update.zip
          asset_name: update.zip
          asset_content_type: application/zip