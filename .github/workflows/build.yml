name: Build, Package, and Release for Windows

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      DOTNET_VERSION: '10.0.x'
      RUNTIME_ID: 'win-x64'
      CONFIGURATION: 'Release'

    steps:
    # ---------------- checkout ----------------
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # ---------------- version ----------------
    - name: Increment version
      id: increment
      run: |
        if [ -f version.ini ]; then
          version=$(grep -oP '^\d+\.\d+\.\d+' version.ini)
        else
          version="1.0.0"
        fi

        IFS='.' read -r -a parts <<< "$version"
        parts[2]=$((parts[2] + 1))
        new_version="${parts[0]}.${parts[1]}.${parts[2]}"
        date=$(date +'%Y-%m-%d')

        echo "$new_version ($date)" > version.ini
        echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
        echo "date=$date" >> "$GITHUB_OUTPUT"

    - name: Commit version file
      if: "!contains(github.event.head_commit.message, 'Increment version')"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add version.ini
        git commit -m "Increment version to ${{ steps.increment.outputs.new_version }}"
        git push

    # ---------------- dotnet ----------------
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore Updater/Updater.csproj

    - name: Build
      run: dotnet build Updater/Updater.csproj --configuration ${{ env.CONFIGURATION }}

    - name: Publish
      run: |
        dotnet publish Updater/Updater.csproj \
          -c ${{ env.CONFIGURATION }} \
          -r ${{ env.RUNTIME_ID }} \
          --self-contained false \
          -p:PublishSingleFile=true \
          -o output

    - name: Verify executable
      run: test -f output/Updater.exe

    # ---------------- package ----------------
    - name: Package artifacts
      run: |
        sha256sum output/Updater.exe > output/Updater.exe.sha256
        sudo apt-get update
        sudo apt-get install -y p7zip-full
        7z a update.zip output/Updater.exe

    - name: Generate update_info.json
      run: |
        printf '{\n  "version": "%s",\n  "updateUrl": "https://github.com/%s/releases/download/v%s/update.zip"\n}\n' \
          "${{ steps.increment.outputs.new_version }}" \
          "${{ github.repository }}" \
          "${{ steps.increment.outputs.new_version }}" > update_info.json

    # ---------------- changelog ----------------
    - name: Generate changelog
      run: |
        git fetch --tags
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$LAST_TAG" ]; then
          git log --pretty=format:"- %s" > changelog.txt
        else
          git log "$LAST_TAG"..HEAD --pretty=format:"- %s" > changelog.txt
        fi

    # ---------------- release body ----------------
    - name: Generate release body
      run: |
        VERSION="${{ steps.increment.outputs.new_version }}"
        DATE="${{ steps.increment.outputs.date }}"

        echo "## 🚀 Updater v$VERSION" > release_body.md
        echo "" >> release_body.md
        echo "Updater 是一个 **用于 Windows 桌面程序的通用更新执行器**，用于在主程序退出后安全完成更新并重新启动程序。" >> release_body.md
        echo "" >> release_body.md
        echo "---" >> release_body.md
        echo "" >> release_body.md
        echo "### 🔧 核心能力" >> release_body.md
        echo "- 支持 ZIP / 安装包 / 增量更新模式" >> release_body.md
        echo "- 自动处理文件占用与权限问题" >> release_body.md
        echo "- 更新失败可追踪（日志输出）" >> release_body.md
        echo "- 适用于启动器 / 自动更新程序" >> release_body.md
        echo "" >> release_body.md
        echo "---" >> release_body.md
        echo "" >> release_body.md
        echo "### 📦 构建信息" >> release_body.md
        echo "- 平台：Windows x64" >> release_body.md
        echo "- 运行时：.NET 10.0" >> release_body.md
        echo "- 构建方式：GitHub Actions 自动构建" >> release_body.md
        echo "- 发布日期：$DATE" >> release_body.md
        echo "" >> release_body.md
        echo "---" >> release_body.md
        echo "" >> release_body.md
        echo "### 📝 本次更新内容" >> release_body.md
        echo "" >> release_body.md
        cat changelog.txt >> release_body.md
        echo "" >> release_body.md
        echo "---" >> release_body.md
        echo "" >> release_body.md
        echo "🔐 所有发布文件均附带 SHA256 校验值" >> release_body.md
        echo "🤖 本版本由 GitHub Actions 自动构建并发布" >> release_body.md

    # ---------------- release ----------------
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "v${{ steps.increment.outputs.new_version }}" \
          update.zip \
          update_info.json \
          output/Updater.exe.sha256 \
          --title "Release v${{ steps.increment.outputs.new_version }} (Windows)" \
          --notes-file release_body.md
