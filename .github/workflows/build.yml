name: Build, Package, and Release for Windows

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
      - 'v*-beta'
      - 'v*-preview'
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      release_type:
        description: '发布类型'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - beta
          - preview

jobs:
  build-and-release:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest

    env:
      RUNTIME_ID: 'win-x64'
      CONFIGURATION: 'Release'
      FRAMEWORKS: 'net6.0 net8.0 net10.0'

    steps:
    # ---------------- checkout ----------------
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # ---------------- read version ----------------
    - name: Read version from version.ini
      id: version
      run: |
        if [ -f version.ini ]; then
          # 使用 cat 读取文件，并用 sed 移除可能的 BOM 和空白字符
          CONTENT=$(cat version.ini | sed 's/^\xEF\xBB\xBF//' | tr -d ' \t\n\r')
          # 使用正则提取版本号
          if [[ "$CONTENT" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            VERSION=""
          fi
        else
          VERSION=""
        fi
        
        # 如果版本号为空或格式不正确，使用默认值
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          VERSION="1.0.0"
        fi

        DATE=$(date +'%Y-%m-%d')

        # 确定发布类型
        # 优先级：1. 手动触发输入 2. 标签名 3. 默认release
        RELEASE_TYPE="release"
        
        # 检查手动触发输入
        if [ "${{ github.event.inputs.release_type }}" != "" ]; then
          RELEASE_TYPE="${{ github.event.inputs.release_type }}"
        # 检查标签
        elif [ "${{ github.ref_type }}" = "tag" ]; then
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" == *"-beta" ]]; then
            RELEASE_TYPE="beta"
          elif [[ "$TAG_NAME" == *"-preview" ]]; then
            RELEASE_TYPE="preview"
          fi
        fi

        echo "release_version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "date=$DATE" >> "$GITHUB_OUTPUT"
        echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"

    # ---------------- dotnet ----------------
    - name: Set up .NET 6
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Set up .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Updater.sln

    - name: Build
      run: dotnet build Updater.sln --configuration ${{ env.CONFIGURATION }}

    # ---------------- publish console versions ----------------
    - name: Publish Console version for .NET 6
      run: |
        dotnet publish Updater/Updater.csproj \
          -c ${{ env.CONFIGURATION }} \
          -r ${{ env.RUNTIME_ID }} \
          -f net6.0 \
          --self-contained false \
          -p:PublishSingleFile=true \
          -o output/console/net6.0

    - name: Publish Console version for .NET 8
      run: |
        dotnet publish Updater/Updater.csproj \
          -c ${{ env.CONFIGURATION }} \
          -r ${{ env.RUNTIME_ID }} \
          -f net8.0 \
          --self-contained false \
          -p:PublishSingleFile=true \
          -o output/console/net8.0

    - name: Publish Console version for .NET 10
      run: |
        dotnet publish Updater/Updater.csproj \
          -c ${{ env.CONFIGURATION }} \
          -r ${{ env.RUNTIME_ID }} \
          -f net10.0 \
          --self-contained false \
          -p:PublishSingleFile=true \
          -o output/console/net10.0

    # ---------------- publish GUI versions ----------------
    - name: Publish GUI version for .NET 6
      run: |
        dotnet publish Updater.Console/Updater.Console.csproj \
          -c ${{ env.CONFIGURATION }} \
          -r ${{ env.RUNTIME_ID }} \
          -f net6.0-windows \
          --self-contained false \
          -p:PublishSingleFile=true \
          -o output/gui/net6.0

    - name: Publish GUI version for .NET 8
      run: |
        dotnet publish Updater.Console/Updater.Console.csproj \
          -c ${{ env.CONFIGURATION }} \
          -r ${{ env.RUNTIME_ID }} \
          -f net8.0-windows \
          --self-contained false \
          -p:PublishSingleFile=true \
          -o output/gui/net8.0

    - name: Publish GUI version for .NET 10
      run: |
        dotnet publish Updater.Console/Updater.Console.csproj \
          -c ${{ env.CONFIGURATION }} \
          -r ${{ env.RUNTIME_ID }} \
          -f net10.0-windows \
          --self-contained false \
          -p:PublishSingleFile=true \
          -o output/gui/net10.0

    # ---------------- verify ----------------
    - name: Verify executables
      run: |
        test -f output/console/net6.0/Updater.exe
        test -f output/console/net8.0/Updater.exe
        test -f output/console/net10.0/Updater.exe
        test -f output/gui/net6.0/Updater.GUI.exe
        test -f output/gui/net8.0/Updater.GUI.exe
        test -f output/gui/net10.0/Updater.GUI.exe

    # ---------------- package ----------------
    - name: Install 7zip
      run: |
        sudo apt-get update
        sudo apt-get install -y p7zip-full

    - name: Package Console versions
      run: |
        cd output/console/net6.0 && 7z a "../../../update_console_net6_v${{ steps.version.outputs.release_version }}.zip" Updater.exe && cd ../../..
        cd output/console/net8.0 && 7z a "../../../update_console_net8_v${{ steps.version.outputs.release_version }}.zip" Updater.exe && cd ../../..
        cd output/console/net10.0 && 7z a "../../../update_console_net10_v${{ steps.version.outputs.release_version }}.zip" Updater.exe && cd ../../..

    - name: Package GUI versions
      run: |
        cd output/gui/net6.0 && 7z a "../../../update_gui_net6_v${{ steps.version.outputs.release_version }}.zip" Updater.GUI.exe && cd ../../..
        cd output/gui/net8.0 && 7z a "../../../update_gui_net8_v${{ steps.version.outputs.release_version }}.zip" Updater.GUI.exe && cd ../../..
        cd output/gui/net10.0 && 7z a "../../../update_gui_net10_v${{ steps.version.outputs.release_version }}.zip" Updater.GUI.exe && cd ../../..

    - name: Generate SHA256 checksums
      run: |
        sha256sum output/console/net6.0/Updater.exe > output/console_net6.sha256
        sha256sum output/console/net8.0/Updater.exe > output/console_net8.sha256
        sha256sum output/console/net10.0/Updater.exe > output/console_net10.sha256
        sha256sum output/gui/net6.0/Updater.GUI.exe > output/gui_net6.sha256
        sha256sum output/gui/net8.0/Updater.GUI.exe > output/gui_net8.sha256
        sha256sum output/gui/net10.0/Updater.GUI.exe > output/gui_net10.sha256

    - name: Generate update_info.json
      run: |
        VERSION="${{ steps.version.outputs.release_version }}"
        REPO="${{ github.repository }}"

        cat > update_info.json <<EOF
{
  "version": "$VERSION",
  "releases": {
    "console": {
      "net6": {
        "url": "https://github.com/$REPO/releases/download/v$VERSION/update_console_net6_v$VERSION.zip",
        "runtime": ".NET 6"
      },
      "net8": {
        "url": "https://github.com/$REPO/releases/download/v$VERSION/update_console_net8_v$VERSION.zip",
        "runtime": ".NET 8"
      },
      "net10": {
        "url": "https://github.com/$REPO/releases/download/v$VERSION/update_console_net10_v$VERSION.zip",
        "runtime": ".NET 10"
      }
    },
    "gui": {
      "net6": {
        "url": "https://github.com/$REPO/releases/download/v$VERSION/update_gui_net6_v$VERSION.zip",
        "runtime": ".NET 6"
      },
      "net8": {
        "url": "https://github.com/$REPO/releases/download/v$VERSION/update_gui_net8_v$VERSION.zip",
        "runtime": ".NET 8"
      },
      "net10": {
        "url": "https://github.com/$REPO/releases/download/v$VERSION/update_gui_net10_v$VERSION.zip",
        "runtime": ".NET 10"
      }
    }
  },
  "default": {
    "console": "https://github.com/$REPO/releases/download/v$VERSION/update_console_net10_v$VERSION.zip",
    "gui": "https://github.com/$REPO/releases/download/v$VERSION/update_gui_net10_v$VERSION.zip"
  }
}
EOF

    # ---------------- changelog ----------------
    - name: Generate changelog
      run: |
        git fetch --tags
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$LAST_TAG" ]; then
          git log --pretty=format:"- %s" > changelog.txt
        else
          git log "$LAST_TAG"..HEAD --pretty=format:"- %s" > changelog.txt
        fi

    # ---------------- release body ----------------
    - name: Generate release body
      run: |
        VERSION="${{ steps.version.outputs.release_version }}"
        DATE="${{ steps.version.outputs.date }}"

        echo "## 🚀 Updater v$VERSION" > release_body.md
        echo "" >> release_body.md
        echo "Updater 是一个 **用于 Windows 桌面程序的通用更新执行器**，用于在主程序退出后安全完成更新并重新启动程序。" >> release_body.md
        echo "" >> release_body.md
        echo "---" >> release_body.md
        echo "" >> release_body.md
        echo "### 📦 包含版本" >> release_body.md
        echo "" >> release_body.md
        echo "**控制台版本（适合后台运行）：**" >> release_body.md
        echo "- `update_console_net6_v$VERSION.zip` - .NET 6" >> release_body.md
        echo "- `update_console_net8_v$VERSION.zip` - .NET 8" >> release_body.md
        echo "- `update_console_net10_v$VERSION.zip` - .NET 10" >> release_body.md
        echo "" >> release_body.md
        echo "**图形界面版本（适合用户交互）：**" >> release_body.md
        echo "- `update_gui_net6_v$VERSION.zip` - .NET 6" >> release_body.md
        echo "- `update_gui_net8_v$VERSION.zip` - .NET 8" >> release_body.md
        echo "- `update_gui_net10_v$VERSION.zip` - .NET 10" >> release_body.md
        echo "" >> release_body.md
        echo "---" >> release_body.md
        echo "" >> release_body.md
        echo "### 🔧 核心能力" >> release_body.md
        echo "- 支持 ZIP / 安装包 / 增量更新模式" >> release_body.md
        echo "- 自动处理文件占用与权限问题" >> release_body.md
        echo "- 更新失败可追踪（日志输出）" >> release_body.md
        echo "- 适用于启动器 / 自动更新程序" >> release_body.md
        echo "- 支持测试模式（--test）进行功能验证" >> release_body.md
        echo "" >> release_body.md
        echo "---" >> release_body.md
        echo "" >> release_body.md
        echo "### 📦 构建信息" >> release_body.md
        echo "- 平台：Windows x64" >> release_body.md
        echo "- 运行时：.NET 6 / .NET 8 / .NET 10（请根据目标环境选择）" >> release_body.md
        echo "- 构建方式：GitHub Actions 自动构建" >> release_body.md
        echo "- 发布日期：$DATE" >> release_body.md
        echo "" >> release_body.md
        echo "---" >> release_body.md
        echo "" >> release_body.md
        echo "### 📝 本次更新内容" >> release_body.md
        echo "" >> release_body.md
        cat changelog.txt >> release_body.md
        echo "" >> release_body.md
        echo "---" >> release_body.md
        echo "" >> release_body.md
        echo "🔐 所有发布文件均附带 SHA256 校验值" >> release_body.md
        echo "🤖 本版本由 GitHub Actions 自动构建并发布" >> release_body.md

    # ---------------- release ----------------
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ steps.version.outputs.release_version }}"
        RELEASE_TYPE="${{ steps.version.outputs.release_type }}"
        
        # 递增版本号（所有类型都递增）
        if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          NEW_PATCH=$((PATCH + 1))
          NEXT_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
        else
          NEXT_VERSION="$VERSION"
        fi
        
        # 根据发布类型生成标签和标题
        TAG_NAME="v$NEXT_VERSION"
        TITLE="Release v$NEXT_VERSION (Windows)"
        PRERELEASE_FLAG=""
        
        case "$RELEASE_TYPE" in
          beta)
            # 获取 beta build 号（从上次发布的标签中提取）
            BETA_BUILD=$(git tag --list "v${NEXT_VERSION}-beta.*" 2>/dev/null | sort -V | tail -1 | sed "s/v${NEXT_VERSION}-beta\.//")
            if [ -z "$BETA_BUILD" ]; then
              BETA_BUILD=1
            else
              BETA_BUILD=$((BETA_BUILD + 1))
            fi
            TAG_NAME="v${NEXT_VERSION}-beta.${BETA_BUILD}"
            TITLE="Beta v${NEXT_VERSION}-beta.${BETA_BUILD} (Windows)"
            PRERELEASE_FLAG="--prerelease"
            ;;
          preview)
            # 获取 preview build 号
            PREVIEW_BUILD=$(git tag --list "v${NEXT_VERSION}-preview.*" 2>/dev/null | sort -V | tail -1 | sed "s/v${NEXT_VERSION}-preview\.//")
            if [ -z "$PREVIEW_BUILD" ]; then
              PREVIEW_BUILD=1
            else
              PREVIEW_BUILD=$((PREVIEW_BUILD + 1))
            fi
            TAG_NAME="v${NEXT_VERSION}-preview.${PREVIEW_BUILD}"
            TITLE="Preview v${NEXT_VERSION}-preview.${PREVIEW_BUILD} (Windows)"
            PRERELEASE_FLAG="--prerelease"
            ;;
          *)
            # release 类型
            ;;
        esac

        gh release create "$TAG_NAME" \
          "update_console_net6_v${NEXT_VERSION}.zip" \
          "update_console_net8_v${NEXT_VERSION}.zip" \
          "update_console_net10_v${NEXT_VERSION}.zip" \
          "update_gui_net6_v${NEXT_VERSION}.zip" \
          "update_gui_net8_v${NEXT_VERSION}.zip" \
          "update_gui_net10_v${NEXT_VERSION}.zip" \
          update_info.json \
          output/console_net6.sha256 \
          output/console_net8.sha256 \
          output/console_net10.sha256 \
          output/gui_net6.sha256 \
          output/gui_net8.sha256 \
          output/gui_net10.sha256 \
          --title "$TITLE" \
          --notes-file release_body.md \
          $PRERELEASE_FLAG

    # ---------------- bump version after release ----------------
    - name: Bump version.ini after release
      if: success() && "${{ steps.version.outputs.release_type }}" == "release"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        OLD="${{ steps.version.outputs.release_version }}"
        
        # 验证版本号格式
        if [[ ! "$OLD" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
          echo "Error: Invalid version format '$OLD', using default 1.0.0"
          OLD="1.0.0"
        fi
        
        # 使用正则捕获组提取版本号各部分
        MAJOR="${BASH_REMATCH[1]}"
        MINOR="${BASH_REMATCH[2]}"
        PATCH="${BASH_REMATCH[3]}"
        
        # 递增补丁版本号（仅正式版）
        NEW_PATCH=$((PATCH + 1))
        NEW="$MAJOR.$MINOR.$NEW_PATCH"

        echo "$NEW" > version.ini

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add version.ini
        git commit -m "chore: bump version to $NEW [skip release]"
        git push
