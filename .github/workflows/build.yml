name: Build, Package, and Release for Windows

on:
  push:
    branches:
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Increment version
      id: increment
      run: |
        if [ -f version.ini ]; then
          version=$(grep -oP '^\d+\.\d+\.\d+' version.ini)
        else
          version="1.0.0"
        fi
        IFS='.' read -r -a parts <<< "$version"
        parts[2]=$((parts[2] + 1))
        new_version="${parts[0]}.${parts[1]}.${parts[2]}"
        date=$(date +'%Y-%m-%d')
        echo "$new_version ($date)" > version.ini
        # 替换set-output为新语法，避免警告
        echo "new_version=$new_version" >> $GITHUB_OUTPUT
        echo "date=$date" >> $GITHUB_OUTPUT

    - name: Commit version file
      if: "!contains(github.event.head_commit.message, 'Increment version')"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 提交代码用内置令牌更合适
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add version.ini
        git commit -m 'Increment version to ${{ steps.increment.outputs.new_version }}'
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/streesobrs/Updater.git HEAD:master

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Cache .NET dependencies
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore Updater/Updater.csproj

    - name: Update version in .csproj
      run: |
        sed -i "s/<Version>.*<\/Version>/<Version>${{ steps.increment.outputs.new_version }}<\/Version>/" Updater/Updater.csproj

    - name: Build for Windows
      run: dotnet build Updater/Updater.csproj --configuration Release --no-restore --runtime win-x64

    - name: Publish for Windows
      run: dotnet publish Updater/Updater.csproj --configuration Release --no-build --output ./output --self-contained false /p:PublishSingleFile=true

    - name: List output directory (debug)
      run: ls -l ./output  

    - name: Verify executable exists
      run: |
        if [ -f "./output/Updater.exe" ]; then
          echo "Windows executable found"
        else
          echo "Windows executable not found"
          exit 1
        fi

    - name: Install 7zip
      run: sudo apt-get install -y p7zip-full

    - name: Create update.zip (仅包含单文件)
      run: 7z a -tzip update.zip ./output/Updater.exe

    - name: Generate update_info.json
      run: |
        echo '{
          "version": "${{ steps.increment.outputs.new_version }}",
          "updateUrl": "https://github.com/streesobrs/Updater/releases/download/v${{ steps.increment.outputs.new_version }}/update.zip"
        }' > update_info.json

    - name: Generate release description
      run: |
        # 生成通用描述
        cat > release_description.md << EOF
        # 程序更新工具 v${{ steps.increment.outputs.new_version }}
        
        ## 🚀 版本特性
        
        - ✅ **程序更新工具** - 专业的软件更新解决方案
        - ✅ **多种更新模式** - 支持ZIP、安装包、增量更新
        - ✅ **GUI图形界面** - 直观易用的图形操作界面
        - ✅ **命令行支持** - 支持自动化脚本集成
        - ✅ **错误处理** - 完善的异常处理和回滚机制
        - ✅ **日志记录** - 详细的运行日志和调试信息
        
        ## 📋 使用说明
        
        ### 命令行模式
        \`\`\`bash
        Updater.exe "主程序.exe" "更新包.zip" "目标目录" false zip
        \`\`\`
        
        ### GUI模式
        \`\`\`bash
        Updater.exe --gui
        # 或
        Updater.exe -g
        \`\`\`
        
        ### GUI模式 + 参数自动填充
        \`\`\`bash
        Updater.exe "主程序.exe" "更新包.zip" "目标目录" false zip -g
        \`\`\`
        
        ## 🔧 系统要求
        - **操作系统**: Windows 10/11
        - **.NET运行时**: .NET 10.0 或更高版本
        - **架构**: x64
        
        ## 📦 文件信息
        - **文件类型**: 单文件可执行程序
        - **SHA256**: 见发布文件校验信息
        
        ## 📝 更新日志
        - 详细更新内容请查看项目提交历史
        
        ---
        *自动生成于 ${{ steps.increment.outputs.date }}*
        EOF

    - name: Create Release with GitHub CLI
      run: |
        # 安装GitHub CLI
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
        sudo apt update
        sudo apt install gh -y
        
        # 设置GitHub CLI认证
        echo "${{ secrets.MY_GITHUB_TOKEN }}" | gh auth login --with-token
        
        # 创建Release
        gh release create v${{ steps.increment.outputs.new_version }} \
          --title "Release v${{ steps.increment.outputs.new_version }} (Windows)" \
          --notes-file release_description.md \
          --repo ${{ github.repository }}

    - name: Upload update.zip to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}  # 使用自定义令牌
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./update.zip
        asset_name: update.zip
        asset_content_type: application/zip

    - name: Upload update_info.json to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}  # 使用自定义令牌
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./update_info.json
        asset_name: update_info.json
        asset_content_type: application/json
    