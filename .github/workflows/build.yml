name: Build, Package, and Release for Windows

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      version_bump:
        description: '版本号更新类型 (major/minor/patch)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

env:
  DOTNET_VERSION: '10.0.x'
  RUNTIME_ID: 'win-x64'
  CONFIGURATION: 'Release'
  PROJECT_NAME: 'Updater'
  OUTPUT_DIR: './publish'
  ASSETS_DIR: './release-assets'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine version increment
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          BUMP_TYPE="${{ github.event.inputs.version_bump }}"
        else
          if [[ "${{ github.event.head_commit.message }}" =~ \[major\] ]]; then
            BUMP_TYPE="major"
          elif [[ "${{ github.event.head_commit.message }}" =~ \[minor\] ]]; then
            BUMP_TYPE="minor"
          else
            BUMP_TYPE="patch"
          fi
        fi
        
        if [ -f version.ini ]; then
          CURRENT_VERSION=$(grep -oP '^\d+\.\d+\.\d+' version.ini)
        else
          CURRENT_VERSION="1.0.0"
        fi
        
        IFS='.' read -r -a VERSION_PARTS <<< "$CURRENT_VERSION"
        
        case "$BUMP_TYPE" in
          "major")
            VERSION_PARTS[0]=$((VERSION_PARTS[0] + 1))
            VERSION_PARTS[1]=0
            VERSION_PARTS[2]=0
            ;;
          "minor")
            VERSION_PARTS[1]=$((VERSION_PARTS[1] + 1))
            VERSION_PARTS[2]=0
            ;;
          "patch")
            VERSION_PARTS[2]=$((VERSION_PARTS[2] + 1))
            ;;
        esac
        
        NEW_VERSION="${VERSION_PARTS[0]}.${VERSION_PARTS[1]}.${VERSION_PARTS[2]}"
        BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        BUILD_TIMESTAMP=$(date +%s)
        
        echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
        echo "build_timestamp=$BUILD_TIMESTAMP" >> $GITHUB_OUTPUT
        echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
        echo "release_tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "version_major=${VERSION_PARTS[0]}" >> $GITHUB_OUTPUT
        echo "version_minor=${VERSION_PARTS[1]}" >> $GITHUB_OUTPUT
        echo "version_patch=${VERSION_PARTS[2]}" >> $GITHUB_OUTPUT

    - name: Update version files
      if: "!contains(github.event.head_commit.message, '[skip-version]')"
      run: |
        echo "${{ steps.version.outputs.new_version }} (${{ steps.version.outputs.build_date }})" > version.ini
        
        if [ -f "$PROJECT_NAME/$PROJECT_NAME.csproj" ]; then
          sed -i "s/<Version>[^<]*<\/Version>/<Version>${{ steps.version.outputs.new_version }}<\/Version>/" $PROJECT_NAME/$PROJECT_NAME.csproj
        fi

    - name: Commit version changes
      if: "github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip-version]')"
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add version.ini $PROJECT_NAME/$PROJECT_NAME.csproj 2>/dev/null || true
        git diff --cached --quiet || {
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }} [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
        }

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore $PROJECT_NAME/$PROJECT_NAME.csproj

    - name: Build project
      run: |
        dotnet build $PROJECT_NAME/$PROJECT_NAME.csproj \
          --configuration ${{ env.CONFIGURATION }} \
          --no-restore \
          --verbosity normal

    - name: Run tests
      run: |
        dotnet test $PROJECT_NAME/$PROJECT_NAME.csproj \
          --no-build \
          --verbosity normal \
          --logger "trx;LogFileName=test-results.trx" \
          --results-directory ./test-results \
          || echo "Tests may have failed, but continuing with build"

    - name: Publish application
      run: |
        dotnet publish $PROJECT_NAME/$PROJECT_NAME.csproj \
          --configuration ${{ env.CONFIGURATION }} \
          --no-build \
          --output ${{ env.OUTPUT_DIR }} \
          --self-contained false \
          /p:PublishSingleFile=true \
          /p:IncludeNativeLibrariesForSelfExtract=true \
          /p:EnableCompressionInSingleFile=true \
          -r ${{ env.RUNTIME_ID }} \
          -p:DebugType=embedded \
          -p:DebugSymbols=true

    - name: Collect file information
      id: file_info
      run: |
        EXECUTABLE_PATH="${{ env.OUTPUT_DIR }}/$PROJECT_NAME.exe"
        
        if [ -f "$EXECUTABLE_PATH" ]; then
          FILE_SIZE=$(stat -c%s "$EXECUTABLE_PATH")
          FILE_SIZE_MB=$(echo "scale=2; $FILE_SIZE / 1024 / 1024" | bc)
          SHA256=$(sha256sum "$EXECUTABLE_PATH" | cut -d' ' -f1)
          MD5=$(md5sum "$EXECUTABLE_PATH" | cut -d' ' -f1)
          
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT
          echo "file_size_mb=$FILE_SIZE_MB" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "md5=$MD5" >> $GITHUB_OUTPUT
          
          echo "$SHA256  $PROJECT_NAME.exe" > ${{ env.OUTPUT_DIR }}/$PROJECT_NAME.exe.sha256
          echo "$MD5  $PROJECT_NAME.exe" > ${{ env.OUTPUT_DIR }}/$PROJECT_NAME.exe.md5
        else
          echo "Executable not found"
          exit 1
        fi

    - name: Prepare release assets
      run: |
        mkdir -p ${{ env.ASSETS_DIR }}
        
        cp ${{ env.OUTPUT_DIR }}/$PROJECT_NAME.exe ${{ env.ASSETS_DIR }}/
        cp ${{ env.OUTPUT_DIR }}/$PROJECT_NAME.exe.sha256 ${{ env.ASSETS_DIR }}/
        cp ${{ env.OUTPUT_DIR }}/$PROJECT_NAME.exe.md5 ${{ env.ASSETS_DIR }}/
        
        7z a -tzip -mx9 ${{ env.ASSETS_DIR }}/update.zip ${{ env.OUTPUT_DIR }}/$PROJECT_NAME.exe

    - name: Generate update_info.json
      run: |
        # 获取提交信息
        LATEST_COMMIT=$(git log -1 --pretty=format:"%s" | sed 's/"/\\"/g')
        COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
        COMMIT_HASH=$(git rev-parse --short HEAD)
        COMMIT_DATE=$(git log -1 --pretty=format:"%ai")
        
        # 获取变更日志
        CHANGELOG_RAW=$(git log --oneline -5 --pretty=format:"- %s [%an]")
        CHANGELOG_JSON=$(echo "$CHANGELOG_RAW" | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')
        
        # 工作流运行信息
        WORKFLOW_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        
        # 文件大小
        EXE_SIZE=${{ steps.file_info.outputs.file_size }}
        EXE_SIZE_MB="${{ steps.file_info.outputs.file_size_mb }}"
        
        # 获取压缩包大小
        ZIP_PATH="${{ env.ASSETS_DIR }}/update.zip"
        if [ -f "$ZIP_PATH" ]; then
          ZIP_SIZE=$(stat -c%s "$ZIP_PATH")
          ZIP_SIZE_MB=$(echo "scale=2; $ZIP_SIZE / 1024 / 1024" | bc)
        else
          ZIP_SIZE=0
          ZIP_SIZE_MB=0
        fi

        # 生成 JSON 文件 - 使用简单的格式
        cat > ${{ env.ASSETS_DIR }}/update_info.json << 'EOF' 
{
  "application": {
    "name": "Updater",
    "displayName": "程序更新工具",
    "description": "专业的软件更新解决方案，支持多种更新模式和自动化部署",
    "version": "${{ steps.version.outputs.new_version }}",
    "buildNumber": "${{ steps.version.outputs.build_timestamp }}"
  },
  "release": {
    "tag": "${{ steps.version.outputs.release_tag }}",
    "date": "${{ steps.version.outputs.build_date }}",
    "type": "${{ steps.version.outputs.bump_type }}",
    "isPrerelease": false
  },
  "files": [
    {
      "name": "Updater.exe",
      "size": ${{ steps.file_info.outputs.file_size }},
      "sizeHuman": "${{ steps.file_info.outputs.file_size_mb }} MB",
      "checksums": {
        "sha256": "${{ steps.file_info.outputs.sha256 }}",
        "md5": "${{ steps.file_info.outputs.md5 }}"
      }
    }
  ],
  "systemRequirements": {
    "operatingSystem": "Windows 10 / Windows Server 2016+",
    "architecture": "x64",
    "dotnetRuntime": "10.0.0+"
  },
  "source": {
    "repository": "${{ github.repository }}",
    "commit": "$COMMIT_HASH"
  },
  "urls": {
    "download": "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.release_tag }}/update.zip",
    "release": "https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.release_tag }}"
  }
}
EOF

        # 现在替换变量
        sed -i "s/\\\${{ steps.version.outputs.new_version }}/${{ steps.version.outputs.new_version }}/g" ${{ env.ASSETS_DIR }}/update_info.json
        sed -i "s/\\\${{ steps.version.outputs.build_timestamp }}/${{ steps.version.outputs.build_timestamp }}/g" ${{ env.ASSETS_DIR }}/update_info.json
        sed -i "s/\\\${{ steps.version.outputs.release_tag }}/${{ steps.version.outputs.release_tag }}/g" ${{ env.ASSETS_DIR }}/update_info.json
        sed -i "s/\\\${{ steps.version.outputs.build_date }}/${{ steps.version.outputs.build_date }}/g" ${{ env.ASSETS_DIR }}/update_info.json
        sed -i "s/\\\${{ steps.version.outputs.bump_type }}/${{ steps.version.outputs.bump_type }}/g" ${{ env.ASSETS_DIR }}/update_info.json
        sed -i "s/\\\${{ steps.file_info.outputs.file_size }}/${{ steps.file_info.outputs.file_size }}/g" ${{ env.ASSETS_DIR }}/update_info.json
        sed -i "s/\\\${{ steps.file_info.outputs.file_size_mb }}/${{ steps.file_info.outputs.file_size_mb }}/g" ${{ env.ASSETS_DIR }}/update_info.json
        sed -i "s/\\\${{ steps.file_info.outputs.sha256 }}/${{ steps.file_info.outputs.sha256 }}/g" ${{ env.ASSETS_DIR }}/update_info.json
        sed -i "s/\\\${{ steps.file_info.outputs.md5 }}/${{ steps.file_info.outputs.md5 }}/g" ${{ env.ASSETS_DIR }}/update_info.json
        sed -i "s|\\\${{ github.repository }}|${{ github.repository }}|g" ${{ env.ASSETS_DIR }}/update_info.json
        sed -i "s|\\\$COMMIT_HASH|$COMMIT_HASH|g" ${{ env.ASSETS_DIR }}/update_info.json

    - name: Validate JSON
      run: |
        if [ -f "${{ env.ASSETS_DIR }}/update_info.json" ]; then
          python3 -c "import json; json.load(open('${{ env.ASSETS_DIR }}/update_info.json')); print('✅ update_info.json 是有效的 JSON 格式')"
        else
          echo "❌ update_info.json 未找到"
          exit 1
        fi

    - name: Create GitHub Release
      if: github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.release_tag }}
        name: "Release ${{ steps.version.outputs.release_tag }}"
        body: |
          # 🚀 Updater ${{ steps.version.outputs.new_version }}
          
          **构建时间**: ${{ steps.version.outputs.build_date }}
          **版本类型**: ${{ steps.version.outputs.bump_type }} 更新
          
          ## 📦 文件信息
          
          | 文件 | 大小 | SHA256 |
          |------|------|--------|
          | Updater.exe | ${{ steps.file_info.outputs.file_size_mb }}MB | `${{ steps.file_info.outputs.sha256 }}` |
          
          ## 🔧 系统要求
          - **操作系统**: Windows 10/11 或 Windows Server 2016+
          - **.NET 运行时**: .NET 10.0 或更高版本
          - **架构**: x64
          
          ## 🚀 使用方式
          
          ```bash
          Updater.exe "主程序.exe" "更新包.zip" "目标目录" false zip
          ```
          
          ## 🔐 安全验证
          
          下载后请验证文件完整性：
          ```bash
          certutil -hashfile Updater.exe SHA256
          ```
          应该得到: `${{ steps.file_info.outputs.sha256 }}`
          
          ---
          *此版本由 GitHub Actions 自动构建发布*
        draft: false
        prerelease: false
        files: |
          ${{ env.ASSETS_DIR }}/*

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: |
          ${{ env.OUTPUT_DIR }}
          ${{ env.ASSETS_DIR }}
        retention-days: 30

    - name: Cleanup
      if: always()
      run: |
        echo "构建完成: ${{ steps.version.outputs.new_version }}"