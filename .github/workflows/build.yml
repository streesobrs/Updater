name: Build, Package, and Release for Windows

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      DOTNET_VERSION: '10.0.x'
      RUNTIME_ID: 'win-x64'
      CONFIGURATION: 'Release'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # 必须，用于生成 changelog

    # ---------------- version ----------------
    - name: Increment version
      id: increment
      run: |
        if [ -f version.ini ]; then
          version=$(grep -oP '^\d+\.\d+\.\d+' version.ini)
        else
          version="1.0.0"
        fi

        IFS='.' read -r -a parts <<< "$version"
        parts[2]=$((parts[2] + 1))
        new_version="${parts[0]}.${parts[1]}.${parts[2]}"
        date=$(date +'%Y-%m-%d')

        echo "$new_version ($date)" > version.ini
        echo "new_version=$new_version" >> $GITHUB_OUTPUT
        echo "date=$date" >> $GITHUB_OUTPUT

    - name: Commit version file
      if: "!contains(github.event.head_commit.message, 'Increment version')"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add version.ini
        git commit -m "Increment version to ${{ steps.increment.outputs.new_version }}"
        git push

    # ---------------- dotnet ----------------
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore Updater/Updater.csproj

    - name: Update version in csproj
      run: |
        sed -i "s/<Version>.*<\/Version>/<Version>${{ steps.increment.outputs.new_version }}<\/Version>/" Updater/Updater.csproj

    - name: Build
      run: dotnet build Updater/Updater.csproj --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Publish
      run: |
        dotnet publish Updater/Updater.csproj \
          --configuration ${{ env.CONFIGURATION }} \
          --no-build \
          --output ./output \
          --self-contained false \
          -r ${{ env.RUNTIME_ID }} \
          /p:PublishSingleFile=true

    - name: Verify executable
      run: |
        test -f ./output/Updater.exe

    # ---------------- package ----------------
    - name: Generate checksums
      run: |
        sha256sum ./output/Updater.exe > ./output/Updater.exe.sha256

    - name: Install 7zip
      run: sudo apt-get install -y p7zip-full

    - name: Create update.zip
      run: 7z a update.zip ./output/Updater.exe

    - name: Generate update_info.json
      run: |
        echo "{
          \"version\": \"${{ steps.increment.outputs.new_version }}\",
          \"updateUrl\": \"https://github.com/${{ github.repository }}/releases/download/v${{ steps.increment.outputs.new_version }}/update.zip\"
        }" > update_info.json

    # ---------------- release notes ----------------
    - name: Generate changelog
      id: changelog
      run: |
        git fetch --tags

        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$LAST_TAG" ]; then
          LOG=$(git log --pretty=format:"- %s")
        else
          LOG=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s")
        fi

        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$LOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Generate release body
      id: release_body
      run: |
        body=$(cat RELEASE_TEMPLATE.md)

        body=${body//'{{VERSION}}'/'${{ steps.increment.outputs.new_version }}'}
        body=${body//'{{DATE}}'/'${{ steps.increment.outputs.date }}'}
        body=${body//'{{CHANGELOG}}'/"${{ steps.changelog.outputs.changelog }}"}

        echo "body<<EOF" >> $GITHUB_OUTPUT
        echo "$body" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    # ---------------- release ----------------
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.increment.outputs.new_version }}
        release_name: Release v${{ steps.increment.outputs.new_version }} (Windows)
        body: ${{ steps.release_body.outputs.body }}
        draft: false
        prerelease: false

    - name: Upload update.zip
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./update.zip
        asset_name: update.zip
        asset_content_type: application/zip

    - name: Upload update_info.json
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./update_info.json
        asset_name: update_info.json
        asset_content_type: application/json

    - name: Upload checksum
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./output/Updater.exe.sha256
        asset_name: Updater.exe.sha256
        asset_content_type: text/plain
