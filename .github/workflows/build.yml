name: Build, Package, and Release for Windows

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      version_bump:
        description: '版本号更新类型 (major/minor/patch)'
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

env:
  DOTNET_VERSION: '10.0.x'
  RUNTIME_ID: 'win-x64'
  CONFIGURATION: 'Release'
  PROJECT_NAME: 'Updater'
  OUTPUT_DIR: './publish'
  ASSETS_DIR: './release-assets'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP="${{ github.event.inputs.version_bump }}"
          else
            MSG="${{ github.event.head_commit.message }}"
            if [[ "$MSG" =~ \[major\] ]]; then
              BUMP="major"
            elif [[ "$MSG" =~ \[minor\] ]]; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
          fi

          if [ -f version.ini ]; then
            CUR=$(grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' version.ini)
          else
            CUR="1.0.0"
          fi

          IFS='.' read -r MA MI PA <<< "$CUR"

          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac

          NEW="$MA.$MI.$PA"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          TS=$(date +%s)

          {
            echo "new_version=$NEW"
            echo "release_tag=v$NEW"
            echo "build_date=$DATE"
            echo "build_timestamp=$TS"
            echo "bump_type=$BUMP"
          } >> "$GITHUB_OUTPUT"

      - name: Update version files
        if: "!contains(github.event.head_commit.message, '[skip-version]')"
        shell: bash
        run: |
          echo "${{ steps.version.outputs.new_version }} (${{ steps.version.outputs.build_date }})" > version.ini

          if [ -f "$PROJECT_NAME/$PROJECT_NAME.csproj" ]; then
            sed -i "s|<Version>.*</Version>|<Version>${{ steps.version.outputs.new_version }}</Version>|" \
              "$PROJECT_NAME/$PROJECT_NAME.csproj"
          fi

      - name: Commit version bump
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip-version]')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.ini "$PROJECT_NAME/$PROJECT_NAME.csproj" || true
          git diff --cached --quiet || {
            git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }} [skip ci]"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git \
              HEAD:${{ github.ref_name }}
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore $PROJECT_NAME/$PROJECT_NAME.csproj

      - name: Build
        run: dotnet build $PROJECT_NAME/$PROJECT_NAME.csproj -c ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test $PROJECT_NAME/$PROJECT_NAME.csproj --no-build || true

      - name: Publish
        run: |
          dotnet publish $PROJECT_NAME/$PROJECT_NAME.csproj \
            -c ${{ env.CONFIGURATION }} \
            -r ${{ env.RUNTIME_ID }} \
            --self-contained false \
            -o ${{ env.OUTPUT_DIR }} \
            /p:PublishSingleFile=true

      - name: Collect file info
        id: fileinfo
        shell: bash
        run: |
          EXE="${{ env.OUTPUT_DIR }}/${{ env.PROJECT_NAME }}.exe"
          test -f "$EXE"

          SIZE=$(stat -c%s "$EXE")
          SHA=$(sha256sum "$EXE" | cut -d' ' -f1)

          {
            echo "size=$SIZE"
            echo "sha256=$SHA"
          } >> "$GITHUB_OUTPUT"

          echo "$SHA  $PROJECT_NAME.exe" > "$EXE.sha256"

      - name: Prepare assets
        shell: bash
        run: |
          mkdir -p "${{ env.ASSETS_DIR }}"
          cp "${{ env.OUTPUT_DIR }}"/* "${{ env.ASSETS_DIR }}/"
          7z a "${{ env.ASSETS_DIR }}/update.zip" \
            "${{ env.OUTPUT_DIR }}/${{ env.PROJECT_NAME }}.exe"

      - name: Generate update_info.json
        shell: bash
        run: |
          cat > "${{ env.ASSETS_DIR }}/update_info.json" <<'EOF'
{
  "name": "Updater",
  "version": "${{ steps.version.outputs.new_version }}",
  "build": "${{ steps.version.outputs.build_timestamp }}",
  "sha256": "${{ steps.fileinfo.outputs.sha256 }}"
}
EOF

      - name: Validate JSON
        run: python3 -c "import json;json.load(open('${{ env.ASSETS_DIR }}/update_info.json'))"

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: Release ${{ steps.version.outputs.release_tag }}
          body: |
            🚀 Updater ${{ steps.version.outputs.new_version }}
            Build time: ${{ steps.version.outputs.build_date }}
          files: |
            ${{ env.ASSETS_DIR }}/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            ${{ env.OUTPUT_DIR }}
            ${{ env.ASSETS_DIR }}
