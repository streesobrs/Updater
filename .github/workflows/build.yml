name: Build, Package, and Release for Windows

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      DOTNET_VERSION: '10.0.x'
      RUNTIME_ID: 'win-x64'
      CONFIGURATION: 'Release'
      PROJECT_PATH: Updater/Updater.csproj
      OUTPUT_DIR: output

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # =========================
    # Version Increment
    # =========================
    - name: Increment version
      id: increment
      run: |
        if [ -f version.ini ]; then
          version=$(grep -oP '^\d+\.\d+\.\d+' version.ini)
        else
          version="1.0.0"
        fi

        IFS='.' read -r -a parts <<< "$version"
        parts[2]=$((parts[2] + 1))
        new_version="${parts[0]}.${parts[1]}.${parts[2]}"
        date=$(date +'%Y-%m-%d')

        echo "$new_version ($date)" > version.ini
        echo "new_version=$new_version" >> $GITHUB_OUTPUT
        echo "date=$date" >> $GITHUB_OUTPUT

    - name: Commit version file
      if: github.actor != 'github-actions[bot]'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add version.ini
        git commit -m "Increment version to ${{ steps.increment.outputs.new_version }}"
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:master

    # =========================
    # .NET Setup
    # =========================
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Display .NET info
      run: |
        dotnet --info
        dotnet --list-sdks
        dotnet --list-runtimes

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    # =========================
    # Build / Test / Publish
    # =========================
    - name: Build
      run: |
        dotnet build ${{ env.PROJECT_PATH }} \
          --configuration ${{ env.CONFIGURATION }} \
          --no-restore \
          -p:Version=${{ steps.increment.outputs.new_version }}

    - name: Run tests (if any)
      continue-on-error: true
      run: |
        dotnet test ${{ env.PROJECT_PATH }} --no-build --verbosity normal

    - name: Publish for Windows
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} \
          --configuration ${{ env.CONFIGURATION }} \
          --no-build \
          -r ${{ env.RUNTIME_ID }} \
          --self-contained false \
          -p:Version=${{ steps.increment.outputs.new_version }} \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          --output ${{ env.OUTPUT_DIR }}

    - name: Verify executable
      run: |
        if [ ! -f "${{ env.OUTPUT_DIR }}/Updater.exe" ]; then
          echo "Updater.exe not found"
          exit 1
        fi
        echo "Executable OK"
        du -h ${{ env.OUTPUT_DIR }}/Updater.exe

    # =========================
    # Checksums
    # =========================
    - name: Generate checksums
      run: |
        sha256sum ${{ env.OUTPUT_DIR }}/Updater.exe > ${{ env.OUTPUT_DIR }}/Updater.exe.sha256
        md5sum ${{ env.OUTPUT_DIR }}/Updater.exe > ${{ env.OUTPUT_DIR }}/Updater.exe.md5

    # =========================
    # Package update.zip
    # =========================
    - name: Install 7zip
      run: sudo apt-get install -y p7zip-full

    - name: Create update.zip
      run: |
        7z a update.zip ${{ env.OUTPUT_DIR }}/Updater.exe

    - name: Generate update_info.json
      run: |
        cat > ${{ env.OUTPUT_DIR }}/update_info.json <<EOF
        {
          "name": "Updater",
          "version": "${{ steps.increment.outputs.new_version }}",
          "publishedAt": "${{ steps.increment.outputs.date }}",
          "platform": "windows-x64",
          "updateUrl": "https://github.com/${{ github.repository }}/releases/download/v${{ steps.increment.outputs.new_version }}/update.zip",
          "checksum": "Updater.exe.sha256"
        }
        EOF

    # =========================
    # Release
    # =========================
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.increment.outputs.new_version }}
        release_name: Release v${{ steps.increment.outputs.new_version }} (Windows)
        draft: false
        prerelease: false
        body: |
          ## 🚀 Updater v${{ steps.increment.outputs.new_version }}

          - Windows x64 单文件可执行程序
          - .NET 10.0
          - 自动构建 & 发布

          **发布日期**：${{ steps.increment.outputs.date }}

    - name: Upload update.zip
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./update.zip
        asset_name: update.zip
        asset_content_type: application/zip

    - name: Upload update_info.json
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ env.OUTPUT_DIR }}/update_info.json
        asset_name: update_info.json
        asset_content_type: application/json

    - name: Upload checksums
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ env.OUTPUT_DIR }}/Updater.exe.sha256
        asset_name: Updater.exe.sha256
        asset_content_type: text/plain
