name: Build, Package, and Release for Windows

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      DOTNET_VERSION: '10.0.x'
      RUNTIME_ID: 'win-x64'
      CONFIGURATION: 'Release'

    steps:
    # ---------------- checkout ----------------
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # ---------------- version ----------------
    - name: Increment version
      id: increment
      run: |
        if [ -f version.ini ]; then
          version=$(grep -oP '^\d+\.\d+\.\d+' version.ini)
        else
          version="1.0.0"
        fi

        IFS='.' read -r -a parts <<< "$version"
        parts[2]=$((parts[2] + 1))
        new_version="${parts[0]}.${parts[1]}.${parts[2]}"
        date=$(date +'%Y-%m-%d')

        echo "$new_version ($date)" > version.ini
        echo "new_version=$new_version" >> $GITHUB_OUTPUT
        echo "date=$date" >> $GITHUB_OUTPUT

    - name: Commit version file
      if: "!contains(github.event.head_commit.message, 'Increment version')"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add version.ini
        git commit -m "Increment version to ${{ steps.increment.outputs.new_version }}"
        git push

    # ---------------- dotnet ----------------
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore Updater/Updater.csproj

    - name: Update version in csproj
      run: |
        sed -i "s/<Version>.*<\/Version>/<Version>${{ steps.increment.outputs.new_version }}<\/Version>/" Updater/Updater.csproj

    - name: Build
      run: dotnet build Updater/Updater.csproj --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Publish
      run: |
        dotnet publish Updater/Updater.csproj \
          --configuration ${{ env.CONFIGURATION }} \
          --no-build \
          --output ./output \
          --self-contained false \
          -r ${{ env.RUNTIME_ID }} \
          /p:PublishSingleFile=true

    - name: Verify executable
      run: test -f ./output/Updater.exe

    # ---------------- package ----------------
    - name: Generate checksum
      run: sha256sum ./output/Updater.exe > ./output/Updater.exe.sha256

    - name: Install 7zip
      run: sudo apt-get install -y p7zip-full

    - name: Create update.zip
      run: 7z a update.zip ./output/Updater.exe

    - name: Generate update_info.json
      run: |
        echo "{
          \"version\": \"${{ steps.increment.outputs.new_version }}\",
          \"updateUrl\": \"https://github.com/${{ github.repository }}/releases/download/v${{ steps.increment.outputs.new_version }}/update.zip\"
        }" > update_info.json

    # ---------------- changelog ----------------
    - name: Generate changelog
      id: changelog
      run: |
        git fetch --tags
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$LAST_TAG" ]; then
          git log --pretty=format:"- %s" > changelog.txt
        else
          git log ${LAST_TAG}..HEAD --pretty=format:"- %s" > changelog.txt
        fi

        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        cat changelog.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    # ---------------- release body ----------------
    - name: Generate release body
      id: release_body
      run: |
        cat > release_body.md <<EOF
## 🚀 Updater v${{ steps.increment.outputs.new_version }}

Updater 是一个 **用于 Windows 桌面程序的通用更新执行器**，  
用于在主程序退出后，安全地执行文件更新，并在完成后重新启动目标程序。

---

### 🔧 核心能力

- 支持 ZIP / 安装包 / 增量三种更新模式
- 自动处理文件占用与权限问题
- 更新失败可追踪（日志输出）
- 内置测试模式，支持异常与性能验证

---

### 🧭 适用场景

- 桌面程序自动更新
- 启动器 / 更新器
- 内部工具分发
- 绿色软件更新

---

### 📦 构建信息

- 平台：Windows x64
- 运行时：.NET 10.0
- 构建方式：GitHub Actions 自动构建
- 发布日期：${{ steps.increment.outputs.date }}

---

## 📝 本次更新内容

${{ steps.changelog.outputs.changelog }}

---

🔐 所有发布文件均附带 SHA256 校验值  
🤖 本版本由 GitHub Actions 自动生成并发布
EOF

        echo "body<<EOF" >> $GITHUB_OUTPUT
        cat release_body.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    # ---------------- release ----------------
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create v${{ steps.increment.outputs.new_version }} \
          update.zip \
          update_info.json \
          ./output/Updater.exe.sha256 \
          --title "Release v${{ steps.increment.outputs.new_version }} (Windows)" \
          --notes-file release_body.md
