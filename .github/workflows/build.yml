name: Build, Package, and Release for Windows

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:  # 允许手动触发构建

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    # 添加环境变量
    env:
      DOTNET_VERSION: '10.0.x'
      RUNTIME_ID: 'win-x64'
      CONFIGURATION: 'Release'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Increment version
      id: increment
      run: |
        if [ -f version.ini ]; then
          version=$(grep -oP '^\d+\.\d+\.\d+' version.ini)
        else
          version="1.0.0"
        fi
        IFS='.' read -r -a parts <<< "$version"
        parts[2]=$((parts[2] + 1))
        new_version="${parts[0]}.${parts[1]}.${parts[2]}"
        date=$(date +'%Y-%m-%d')
        echo "$new_version ($date)" > version.ini
        echo "new_version=$new_version" >> $GITHUB_OUTPUT
        echo "date=$date" >> $GITHUB_OUTPUT

    - name: Commit version file
      if: "!contains(github.event.head_commit.message, 'Increment version')"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 提交代码用内置令牌更合适
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add version.ini
        git commit -m "Increment version to ${{ steps.increment.outputs.new_version }}"
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/streesobrs/Updater.git HEAD:master

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Setup .NET Core SDK tools
      run: dotnet tool install -g dotnet-reportgenerator-globaltool
    
    - name: Display .NET version info
      run: |
        dotnet --info
        dotnet --list-sdks
        dotnet --list-runtimes

    - name: Cache .NET dependencies
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore Updater/Updater.csproj

    - name: Update version in .csproj
      run: |
        sed -i "s/<Version>.*<\/Version>/<Version>${{ steps.increment.outputs.new_version }}<\/Version>/" Updater/Updater.csproj

    - name: Build for Windows
      run: dotnet build Updater/Updater.csproj --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Run unit tests (if any)
      if: always()
      run: dotnet test --no-build --verbosity normal --logger trx --results-directory ./test-results

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results/
        retention-days: 30

    - name: Publish for Windows
      run: dotnet publish Updater/Updater.csproj --configuration ${{ env.CONFIGURATION }} --no-build --output ./output --self-contained false /p:PublishSingleFile=true -r ${{ env.RUNTIME_ID }}

    - name: List output directories (debug)
      run: |
        echo "=== Output Directory ==="
        ls -l ./output

    - name: Verify executable exists
      run: |
        if [ -f "./output/Updater.exe" ]; then
          echo "Windows executable found"
          echo "File size: $(du -h ./output/Updater.exe | cut -f1)"
        else
          echo "Windows executable not found"
          exit 1
        fi

    - name: Generate file checksums
      run: |
        echo "=== File Checksums ==="
        sha256sum ./output/Updater.exe > ./output/Updater.exe.sha256
        md5sum ./output/Updater.exe > ./output/Updater.exe.md5
        cat ./output/Updater.exe.sha256
        cat ./output/Updater.exe.md5

    - name: Security scan with trivy (optional)
      if: always()
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './output'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload security scan results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-results
        path: trivy-results.sarif
        retention-days: 30

    - name: Install 7zip
      run: sudo apt-get install -y p7zip-full

    - name: Create update.zip file
      run: |
        # 创建压缩包
        7z a -tzip update.zip ./output/Updater.exe

    - name: Generate update_info.json
      run: |
        echo '{
          "version": "${{ steps.increment.outputs.new_version }}",
          "updateUrl": "https://github.com/streesobrs/Updater/releases/download/v${{ steps.increment.outputs.new_version }}/update.zip"
        }' > update_info.json



    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.increment.outputs.new_version }}
        release_name: Release v${{ steps.increment.outputs.new_version }} (Windows)
        body: |
          # 程序更新工具 v${{ steps.increment.outputs.new_version }}
          
          ## 🚀 版本特性
          
          - ✅ **程序更新工具** - 专业的软件更新解决方案
          - ✅ **多种更新模式** - 支持ZIP、安装包、增量更新
          - ✅ **命令行支持** - 支持自动化脚本集成
          - ✅ **错误处理** - 完善的异常处理和回滚机制
          - ✅ **日志记录** - 详细的运行日志和调试信息
          
          ## 📋 使用说明
          
          ### 命令行模式
          ```bash
          Updater.exe "主程序.exe" "更新包.zip" "目标目录" false zip
          ```
          
          ## 🔧 系统要求
          - **操作系统**: Windows 10/11
          - **.NET运行时**: .NET 10.0 或更高版本
          - **架构**: x64
          
          ## 📦 文件信息
          - **文件类型**: 单文件可执行程序
          - **SHA256**: 见发布文件校验信息
          
          ## 📝 更新日志
          - 详细更新内容请查看项目提交历史
          
          ---
          *自动生成于 ${{ steps.increment.outputs.date }}*
        draft: false
        prerelease: false

    - name: Upload update.zip to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}  # 使用自定义令牌
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./update.zip
        asset_name: update.zip
        asset_content_type: application/zip

    - name: Upload update_info.json to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}  # 使用自定义令牌
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./update_info.json
        asset_name: update_info.json
        asset_content_type: application/json

    - name: Upload checksums to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}  # 使用自定义令牌
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./output/Updater.exe.sha256
        asset_name: Updater.exe.sha256
        asset_content_type: text/plain

    - name: Upload md5 checksum to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}  # 使用自定义令牌
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./output/Updater.exe.md5
        asset_name: Updater.exe.md5
        asset_content_type: text/plain

    - name: Upload executable as artifact (for debugging)
      uses: actions/upload-artifact@v4
      with:
        name: updater-executable
        path: ./output/Updater.exe
        retention-days: 7
    